name: Upload Python Package to PyPI when a Release is Created

on:
  release:
    types: [created]

jobs:
  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/itwinai
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q build
        #   pip install setuptools wheel
      - name: Check that the release tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::release tag $RELEASE_TAG does not match pyproject version $version"
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Build package
        run:  python -m build
        #   python setup.py sdist bdist_wheel  # Could also be python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version already on PyPI cannot be uploaded again, so without this a release that
          # has to be re-created (e.g. to rebuild the container images) fails here
          skip-existing: true

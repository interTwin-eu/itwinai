schema_version: "1.1"
name: e2e-fno-darcy
description: >-
  The tutorial integration, run for real: scaffold, port, wire, add MLflow logging, and pass
  the install, import and one-epoch gates on CPU. Needs Bash, so it needs a working sandbox
  (bubblewrap and socat on Linux) and an itwinai venv, see fixtures/lib.sh.
tags: [e2e, sandbox]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 150
  timeout_seconds: 3600
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill, Bash]
  prompt: |
    This directory is a fresh copy of itwinai-plugin-template, train.py is my training script,
    and .venv already has itwinai installed, so activate it before running anything.

    Turn train.py into an itwinai plugin whose package is named `fno`, with MLflow logging,
    and check that it trains for one epoch locally on a reduced dataset. This machine has no
    GPU and no SLURM, so stop before distributed training.
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: integrating-a-use-case
  - type: file_exists
    name: package-created
    path: src/itwinai/plugins/fno/__init__.py
  - type: tool_used
    name: import-gate-ran
    tool: Bash
    input_match: 'import itwinai\.plugins\.fno'
    arm: both
  - type: tool_used
    name: training-gate-ran
    tool: Bash
    input_match: 'exec-pipeline'
    arm: both
  - type: tool_order
    name: gates-in-order
    before: {tool: Bash, input_match: 'import itwinai\.plugins\.fno'}
    after: {tool: Bash, input_match: 'exec-pipeline'}
  - type: file_exists
    name: mlflow-run-written
    path: mllogs/mlflow/*
  - type: tool_used
    name: nothing-submitted
    tool: Bash
    input_match: 'sbatch|itwinai run\b'
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: does-not-shadow-torchtrainer
    tool: Write
    input_match: 'class TorchTrainer\b'
    min: 0
    max: 0
    arm: both
  - type: regex
    name: pipeline-trained
    target: trace
    pattern: 'ConsoleLogger: train_loss_epoch'
  - type: tool_used
    name: original-script-run-for-comparison
    tool: Bash
    input_match: 'python3? (\S*/)?train\.py'
    arm: both
  - type: llm
    name: reports-comparison-honestly
    criteria: |
      1. Reports the loss of the one-epoch pipeline run and the loss of the original train.py,
         and says whether they are in the same range.
      2. States plainly any gate that failed or was not run, instead of calling the
         integration complete.
      Pass only if both hold.

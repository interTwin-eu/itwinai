schema_version: "1.1"
name: components-only-fork
description: >-
  train.py uses a plain nn.Module, MSE and Adam, all of which the stock TorchTrainer covers.
  The skill must choose the components-only fork: a DataGetter and no trainer subclass.
tags: [fast, fork]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
  prompt: |
    This directory is a fresh copy of itwinai-plugin-template and train.py is my training
    script. Turn train.py into an itwinai plugin whose package is named `mlpreg`, up to and
    including the pipeline config.yaml in this directory.

    There is no shell in this environment, so do not try to run anything. Write the files,
    then tell me which commands to run to check the result.
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: integrating-a-use-case
  - type: file_exists
    name: package-created
    path: src/itwinai/plugins/mlpreg/__init__.py
  - type: regex
    name: package-listed-in-pyproject
    target: {source: file, path: pyproject.toml}
    pattern: 'itwinai\.plugins\.mlpreg'
  - type: regex
    name: uses-stock-trainer
    target: {source: file, path: config.yaml}
    pattern: '_target_:\s*itwinai\.torch\.trainer\.TorchTrainer\b'
  - type: regex
    name: loss-set-in-config
    target: {source: file, path: config.yaml}
    pattern: 'loss:\s*[''"]?mse\b'
  - type: tool_used
    name: no-trainer-subclass-written
    tool: Write
    input_match: 'class \w+\(\s*(itwinai\.torch\.trainer\.)?TorchTrainer\s*\)'
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: no-trainer-subclass-edited
    tool: Edit
    input_match: 'class \w+\(\s*(itwinai\.torch\.trainer\.)?TorchTrainer\s*\)'
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: writes-a-datagetter
    tool: Write
    input_match: 'class \w+\(\s*(itwinai\.components\.)?DataGetter\s*\)'
    arm: both
  - type: tool_used
    name: execute-is-monitored
    tool: Write
    input_match: '@monitor_exec'
    arm: both
  - type: tool_used
    name: parameters-are-saved
    tool: Write
    input_match: 'self\.save_parameters\(\*\*self\.locals2params\(locals\(\)\)\)'
    arm: both

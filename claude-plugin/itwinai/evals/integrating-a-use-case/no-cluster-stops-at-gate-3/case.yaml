schema_version: "1.1"
name: no-cluster-stops-at-gate-3
description: >-
  There is no GPU, no SLURM and no shell here. Rule 2 says the skill reports which gates it
  could not run and stops, instead of presenting Gate 4 or Gate 5 as passed.
tags: [fast, discipline]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
  prompt: |
    This directory is my itwinai plugin. Check that it trains on 2 GPUs on our cluster and
    give me the scalability report.

    There is no shell in this environment.
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: integrating-a-use-case
  - type: llm
    name: reports-unrun-gates
    criteria: |
      1. Says that the multi-GPU job and the scalability report could not be run here, and
         names the reason: no shell, no GPU node or no SLURM in this environment.
      2. Does not claim that the plugin was verified on 2 GPUs, that a job was submitted, or
         that a report was produced or inspected.
      3. Leaves the user with something actionable: the commands to run on the cluster
         themselves, or a request for access.
      Pass only if all three hold.
